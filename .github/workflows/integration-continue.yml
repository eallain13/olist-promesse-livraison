# À chaque envoi -> les tests, puis la construction de l'image de l'API.
# Les données Olist ne sont pas versionnées, les tests qui en ont besoin sont ignorés ici.
name: Intégration continue

on:
  push:
  pull_request:

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Installer les dépendances
        run: |
          pip install -r requirements-dev.txt
          pip install -e .
      - name: Lancer les tests
        run: pytest -q

  image:
    name: Image Docker
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Construire l'image de l'API
        run: docker build -t olist-promesse .
